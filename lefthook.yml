# Git hooks managed by lefthook (https://github.com/evilmartians/lefthook)
# Run `bundle exec lefthook install` after bundling to (re)generate the Git hooks.
#
# These mirror the checks enforced in CI (.github/workflows/ci.yml) so problems
# are caught locally before they ever reach a pull request.

pre-commit:
  parallel: true
  commands:
    rubocop:
      tags: lint
      glob: "*.rb"
      # Only lint the Ruby files that are actually staged for speed.
      run: bin/rubocop --force-exclusion {staged_files}

    brakeman:
      tags: security
      # Static analysis for common Rails security vulnerabilities.
      run: bin/brakeman --no-pager --quiet

    bundler-audit:
      tags: security
      # Scan Ruby gems for known vulnerabilities against the local advisory DB.
      # No --update here: it shells out to `git pull origin master`, which during
      # a worktree Git hook inherits the leaked GIT_DIR and targets this repo
      # (which has no `master` branch) instead of the advisory-DB clone. CI runs
      # the same flagless command; refresh the DB out of band if needed.
      run: bin/bundler-audit check

    importmap-audit:
      tags: security
      # Scan importmap-pinned JavaScript for known vulnerabilities (mirrors the
      # scan_js CI job, which audits both importmap and npm dependencies).
      run: bin/importmap audit

    npm-audit:
      tags: security
      # Scan npm dependencies for known vulnerabilities.
      glob: "{package.json,package-lock.json}"
      run: npm audit --audit-level=moderate

# Unit + integration tests are heavier than the lint/security scans, so they run
# on push rather than on every commit. System tests (bin/rails test:system) spin
# up a headless browser and are left to CI / manual runs.
pre-push:
  commands:
    tests:
      run: bin/rails test
