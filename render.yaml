# Render Blueprint (Infrastructure as Code) — modeled on jeero's blueprint.
#
# Production is defined under the project/environment structure so its env group
# is created INSIDE the Production environment and bound to the services. A flat
# top-level envVarGroup lands at workspace scope and does NOT resolve for
# services that live in a project environment (jeero learned this the hard way:
# the first sync produced production services with no env vars and a failed boot).
#
# Staging stays a flat top-level definition: top-level resources keep their
# currently assigned environment across syncs.
#
# HTTP_AUTH_USER / HTTP_AUTH_PASSWORD (sync: false — set in the dashboard)
# gate the whole site behind HTTP basic auth while pre-launch; unset them to
# open the site, no deploy required.

databases:
  - name: aperto-wine-staging-db
    plan: basic-256mb
    ipAllowList: []

services:
  - type: web
    name: aperto-wine-staging
    runtime: ruby
    plan: standard
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails server -p $PORT -e production
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aperto-wine-staging-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # No dedicated worker on staging: Puma runs the Solid Queue supervisor
      # in-process (config/puma.rb gates on this).
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: APP_HOST
        sync: false
      - key: APP_PROTOCOL
        value: https
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "1"
      - key: DB_POOL
        value: "10"
      - key: LD_PRELOAD
        value: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      - key: GC_AUTO_COMPACT
        value: "1"
      - key: RUBY_YJIT_ENABLE
        value: "0"
      - key: HTTP_AUTH_USER
        sync: false
      - key: HTTP_AUTH_PASSWORD
        sync: false

# ------------------------------------------------------------------------
# PRODUCTION — intentionally commented out until launch so the Blueprint
# only creates staging resources (the production branch does not exist yet
# and idle production services would still be billed). To go live: uncomment
# this block, sync the Blueprint, then push main to the production branch.
