# Osteria's only active list — the public-menu tests that expect Barolo and
# Gavi to render (grouped by colour) target this list.
osteria_barolo:
  wine_list: osteria_list
  wine: barolo
  position: 1

osteria_gavi:
  wine_list: osteria_list
  wine: gavi
  position: 2

# Active but zero glasses — drives the "sold out badge" public-menu test.
osteria_sold_out:
  wine_list: osteria_list
  wine: sold_out_wine
  position: 3

# Task 3 fixtures — see test/fixtures/wines.yml for why each exists.
osteria_full_character:
  wine_list: osteria_list
  wine: full_character_wine
  position: 4

osteria_bottle_only:
  wine_list: osteria_list
  wine: bottle_only_wine
  position: 5

summer_barolo:
  wine_list: summer
  wine: barolo
  position: 1

# Featured on an active list but available_glasses: 0 — drives the
# "currently unavailable / On Deck" public-menu rendering test.
summer_sold_out:
  wine_list: summer
  wine: sold_out_wine
  position: 2

winter_gavi:
  wine_list: winter
  wine: gavi
  position: 1

# Trattoria's active "House Picks" list drives the curated public-menu test:
# chianti is pourable, reserve_barbaresco is featured but sold out (On Deck).
trattoria_chianti:
  wine_list: trattoria_list
  wine: chianti
  position: 1

trattoria_soldout:
  wine_list: trattoria_list
  wine: trattoria_sold_out
  position: 2

trattoria_white_item:
  wine_list: trattoria_list
  wine: trattoria_white
  position: 3

# Carries trattoria_franciacorta on the published list so cart specs can add
# it as a normal, purchasable wine. It is sparkling rather than red or white,
# so it forms its own colour group and leaves the red/white group assertions
# on trattoria_list untouched.
trattoria_reserve_franciacorta:
  wine_list: trattoria_list
  wine: trattoria_franciacorta
  position: 4

# mixed_order_list: item positions deliberately contradict colour enum order
# (white first, dessert second, red last) so the helper's grouping can only
# be enum-order-based, never position-order-based, to pass.
mixed_order_white:
  wine_list: mixed_order_list
  wine: gavi
  position: 1

mixed_order_dessert:
  wine_list: mixed_order_list
  wine: osteria_moscato
  position: 2

mixed_order_red:
  wine_list: mixed_order_list
  wine: barolo
  position: 3
