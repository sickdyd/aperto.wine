# A restaurant publishes exactly one list at a time (partial unique index on
# wine_lists.restaurant_id WHERE published), so each restaurant below has one
# `published: true` fixture and any number of drafts.

# Osteria's published list — the public-menu tests that expect Barolo and Gavi
# to render (grouped by colour) target this list.
osteria_list:
  restaurant: osteria
  name: Wine List
  slug: wine-list
  position: 1
  published: true

summer:
  restaurant: osteria
  name: Summer Selection
  slug: summer-selection
  season: Summer
  position: 2
  published: false

winter:
  restaurant: osteria
  name: Winter Selection
  slug: winter-selection
  season: Winter
  position: 3
  published: false

trattoria_list:
  restaurant: trattoria
  name: House Picks
  slug: house-picks
  position: 1
  published: true

# Trattoria's draft — unpublished, so it drives the "a draft list's URL
# redirects to the published one" menu tests. Deliberately holds no items:
# every purchasable trattoria wine lives on trattoria_list, since only a
# published list's wines can reach the cart.
trattoria_reserve:
  restaurant: trattoria
  name: Reserve Selection
  slug: reserve-selection
  position: 2
  published: false

# Unpublished — never queried by the controller. Exists only so the helper
# unit tests can prove colour grouping follows Wine's color enum order rather
# than alphabetical order or item position order: its item positions (white
# first, dessert second, red last) deliberately contradict enum order
# (red: 0, white: 1, dessert: 4), and its colours (dessert, red, white)
# deliberately contradict alphabetical order.
mixed_order_list:
  restaurant: osteria
  name: Mixed Order Check
  slug: mixed-order-check
  position: 4
  published: false
