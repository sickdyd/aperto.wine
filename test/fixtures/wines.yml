# A white wine on trattoria's list — gives "House Picks" a second colour
# group, driving the multi-section jump-nav test.
trattoria_white:
  restaurant: trattoria
  name: Arneis dei Colli
  producer: Vietti
  color: 1
  bottle_size_ml: 750
  available_glasses: 5
  position: 3
  active: true

# Dessert wine used only to prove colour grouping follows Wine's color enum
# order (red: 0, white: 1, ..., dessert: 4), not alphabetical order (which
# would put "dessert" before "red"/"white").
osteria_moscato:
  restaurant: osteria
  name: Moscato d'Asti
  producer: Vietti
  color: 4
  bottle_size_ml: 750
  available_glasses: 6
  position: 1
  active: true

# None of the other trattoria wines have any glass price set, so cart specs
# (which need a second restaurant with a purchasable wine, to prove carts
# stay independent and cross-restaurant adds are rejected) need one that does.
# Published on wine_lists(:trattoria_reserve) — see that fixture's comment.
#
# Colour is sparkling (not red/white) deliberately: trattoria_list already
# renders Red and White jump-nav sections, so a second active list holding
# another red or white wine would render a duplicate same-coloured nav chip
# and make `click_link "Red"`/`click_link "White"` ambiguous in
# test/system/public_menu_test.rb.
trattoria_franciacorta:
  restaurant: trattoria
  name: Franciacorta Brut
  producer: Ca' del Bosco
  color: 3
  bottle_size_ml: 750
  price_125ml_cents: 1000
  available_glasses: 8
  position: 4
  active: true

# Priced, available and active, but deliberately on no wine_list_items row at
# all — proves the cart rejects a wine that was never published on any list
# (Task 6: cart lookups are scoped through published lists, not the bare
# tenant association).
unlisted_wine:
  restaurant: osteria
  name: Unlisted Reserve
  producer: Vietti
  color: 0
  bottle_size_ml: 750
  price_125ml_cents: 1000
  available_glasses: 5
  position: 100
  active: true

# Carries every Task 3 attribute at once — short_description (which must
# replace description as the row's note), style, abv, all four tasting
# axes, all four certifications, aromas, and food_pairings — so a single
# integration test can assert every one renders. Colour is rose,
# deliberately distinct from osteria's existing red/white wines so it never
# interacts with tests scoped to those two colour groups.
full_character_wine:
  restaurant: osteria
  name: Amphora Rosato
  producer: Cascina Roera
  color: 2
  region: Piemonte
  style: Skin-contact
  description: A longer tasting note that short_description should replace.
  short_description: A savoury skin-contact rosé with a bright, mineral finish.
  bottle_size_ml: 750
  price_bottle_cents: 8500
  price_125ml_cents: 900
  available_glasses: 6
  position: 101
  active: true
  abv: 12.5
  body: 3
  tannins: 2
  acidity: 4
  sweetness: 1
  organic: true
  natural_wine: true
  vegan: false
  biodynamic: false
  aromas: [ "wild strawberry", "orange peel", "sea salt" ]
  food_pairings: [ "grilled fish", "soft cheese" ]

# Bottle-priced but zero glasses — drives "a wine with bottles but no
# glasses renders orderable rather than sold out" (Task 1 widened
# Wine#available? for exactly this case). Colour is sparkling, distinct from
# both the red/white groups and full_character_wine's rose.
bottle_only_wine:
  restaurant: osteria
  name: Cellar Reserve Magnum
  color: 3
  bottle_size_ml: 1500
  price_bottle_cents: 18000
  available_glasses: 0
  position: 102
  active: true
