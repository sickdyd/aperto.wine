      order_item:
        glass_size_ml: "Glass size"
        quantity: "Quantity"
        unit_price_cents: "Unit price"
        order: "Order"
        wine: "Wine"
    errors:
      # invalid_url and wrong_restaurant are custom messages with no rails-i18n
      # fallback, so every locale must define them.
      #
      # The gender/parity keys below (too_long, too_short, blank, invalid)
      # mirror rails-i18n's generic English defaults (errors.messages.*). Their
      # only reason to exist in English is parity with the Italian overrides,
      # which agree in gender. They are NOT required for English to render right:
      # for validation errors ActiveModel passes the whole error-key chain as
      # symbol defaults, which I18n exhausts within :en — reaching the gem's
      # English errors.messages.too_long — before the :it fallback is consulted,
      # even though I18n.fallbacks[:en] == [:en, :it]. So English resolves in
      # English without these. We carry them anyway to keep en.yml and it.yml
      # structurally identical key-for-key (the parity the user asked for, and
      # what the i18n-tasks gate enforces). Because they duplicate the gem's
      # values, a guard test (test/models/italian_validation_messages_test.rb)
      # asserts they still match the gem, so an upstream reword fails loudly here
      # instead of drifting silently.
      models:
        wine:
          attributes:
            image_url:
              invalid_url: "must be an http(s) URL"
            short_description:
              too_long:
                one: "is too long (maximum is %{count} character)"
                other: "is too long (maximum is %{count} characters)"
        wine_list:
          attributes:
            season:
              too_long:
                one: "is too long (maximum is %{count} character)"
                other: "is too long (maximum is %{count} characters)"
        restaurant_table:
          attributes:
            area:
              too_long:
                one: "is too long (maximum is %{count} character)"
                other: "is too long (maximum is %{count} characters)"
        wine_list_item:
          attributes:
            wine:
              wrong_restaurant: "must belong to the same restaurant as the list"
        restaurant:
          attributes:
            geofence_enabled:
              requires_coordinates: "can't be enabled without the restaurant's coordinates"
        user:
          attributes:
            password:
              too_short:
                one: "is too short (minimum is %{count} character)"
                other: "is too short (minimum is %{count} characters)"
              blank: "can't be blank"
            email:
              blank: "can't be blank"
              invalid: "is invalid"
