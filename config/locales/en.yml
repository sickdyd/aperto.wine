  landing:
    title: "Wine Sharing — By the Glass, By Choice"
    meta_description: "A live digital wine list that lets restaurants sell premium bottles by the glass. Customers discover and order fine wines without committing to a full bottle."
    sign_in: "Sign In"
    sign_up: "Get Started"
    hero_tagline: "The live wine list"
    hero_title_html: "Every great bottle<br>deserves to be <em>opened</em>"
    hero_subtitle: "A digital wine list that lets your restaurant sell premium bottles by the glass. Your customers order. You pour. No waste."
    scroll: "Discover"
    problem_label: "The challenge"
    problem_title: "Fine wines gather dust on your shelves"
    problem_description: "Premium bottles remain unsold because customers won't commit to a full bottle. Opening them is a gamble — one glass ordered today means the rest might go to waste tomorrow. Paper menus can't keep up with daily availability."
    solution_label: "The answer"
    solution_title: "A live menu that moves your inventory"
    solution_description: "Wine Sharing gives your customers a real-time digital wine list. They see what's available right now, order by the glass, and you only open what sells. No guesswork. No waste. Just wine, shared."
    how_label: "How it works"
    how_title: "Three steps to your first pour"
    steps:
      - title: "Curate your list"
        description: "Add wines you want to offer by the glass. Set prices, glass sizes, and availability. Update anytime."
      - title: "Place the QR code"
        description: "Print the generated QR code for your tables. Customers scan and instantly see your live wine selection."
      - title: "Pour and earn"
        description: "Customers order from their phone. You approve, pour, and turn idle inventory into revenue."
    restaurants_label: "For restaurants"
    restaurants_title: "Turn idle stock into poured profit"
    restaurants_description: "Your premium bottles shouldn't sit unopened. Wine Sharing lets you offer any wine by the glass with zero overhead — no reprinting menus, no verbal pitch. Just a live list your customers trust."
    restaurants_cta: "Register your restaurant"
    restaurant_features:
      - icon: "list-bullets"
        title: "Live menu"
        description: "Update availability in real time. No paper, no delay."
      - icon: "qr-code"
        title: "QR access"
        description: "One scan and your customers see every available wine."
      - icon: "currency-eur"
        title: "Flexible pricing"
        description: "Set per-glass prices for 75ml, 100ml, 125ml, or 150ml."
      - icon: "check-circle"
        title: "Order approval"
        description: "Review and confirm each order before pouring."
    customers_label: "For wine lovers"
    customers_title: "Taste the bottles you've always wanted"
    customers_description: "No more choosing between an expensive full bottle or settling for the house wine. Browse what's available at your table, order a single glass of something extraordinary."
    customers_cta: "Browse as a customer"
    customer_features:
      - icon: "magnifying-glass"
        title: "Discover"
        description: "Search by color, grape, year, or price range."
      - icon: "wine"
        title: "Order by the glass"
        description: "Choose your pour size and add to cart in one tap."
      - icon: "clock"
        title: "Freshly opened"
        description: "See when each bottle was opened for peak freshness."
      - icon: "map-pin"
        title: "At your table"
        description: "Scan the QR, order, and your wine arrives moments later."
    cta_title: "Ready to pour?"
    cta_subtitle: "Join the restaurants already turning their finest bottles into shared experiences."
