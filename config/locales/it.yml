      pending: "Da completare"
    subprocessors:
      name: "Fornitore"
      role: "Che cosa fa"
      location: "Dove"
    # L'art. 13 GDPR vuole l'informativa dove i dati sono raccolti: per questo
    # i due avvisi stanno sul modulo d'ordine e su quello di registrazione, non
    # solo nel piè di pagina.
    order_notice_html: "Inviando l'ordine il tuo nome e il tavolo vengono comunicati al ristorante, che decide come gestirlo — vedi l'%{privacy} e i %{terms}."
    signup_notice_html: "Creando un account accetti i %{terms} e l'%{privacy}, compresa la nomina di aperto.wine a responsabile del trattamento dei dati dei tuoi ospiti."
