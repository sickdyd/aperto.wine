  # I due documenti legali. Qui vive solo la cornice — titoli, etichette, gli
  # avvisi che li richiamano. Il testo dei documenti sta nei template con
  # suffisso di lingua (app/views/legal/privacy.it.html.erb): è prosa lunga, le
  # cui frasi non sono stringhe riutilizzabili, e sommergerebbe i file di lingua.
  legal:
    nav:
      privacy: "Privacy"
      terms: "Termini"
      # Nome accessibile della navigazione a piè di ciascun documento.
      label: "Documenti legali"
    eyebrow:
      privacy: "Protezione dei dati"
      terms: "Condizioni d'uso"
    back_to_site: "Torna ad aperto.wine"
    updated_on: "Ultimo aggiornamento %{date}"
    privacy:
      title: "Informativa privacy"
      meta_description: "Come aperto.wine tratta i dati di ospiti e ristoratori, e chi è titolare di che cosa."
    terms:
      title: "Termini e condizioni"
      meta_description: "I termini di aperto.wine: il rapporto sul vino è tra ospite e ristorante, noi siamo l'intermediario tecnico."
    # Il blocco di identità del gestore — D.Lgs. 70/2003 art. 7 e DSA artt. 30–31.
    identity:
      heading: "Informazioni legali"
      name: "Gestore"
      address: "Sede legale"
      email: "Email"
      phone: "Telefono"
      vat_number: "Partita IVA"
      rea_number: "Numero REA"
      # Mostrato al posto di un campo che il deploy non ha ancora impostato:
