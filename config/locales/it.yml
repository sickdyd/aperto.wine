  landing:
    title: "aperto.wine — Al Calice, Per Scelta"
    meta_description: "Una carta dei vini digitale e aggiornata in tempo reale che permette ai ristoranti di vendere bottiglie pregiate al calice. I clienti scoprono e ordinano vini eccellenti senza impegnarsi per un'intera bottiglia."
    sign_in: "Accedi"
    sign_up: "Inizia ora"
    hero_tagline: "La carta dei vini live"
    hero_title_html: "Ogni grande bottiglia<br>merita di essere <em>aperta</em>"
    hero_subtitle: "Una carta dei vini digitale che permette al tuo ristorante di vendere bottiglie pregiate al calice. I clienti ordinano. Tu versi. Nessuno spreco."
    scroll: "Scopri"
    problem_label: "La sfida"
    problem_title: "I vini pregiati prendono polvere sugli scaffali"
    problem_description: "Le bottiglie premium restano invendute perché i clienti non vogliono impegnarsi per un'intera bottiglia. Aprirle è un rischio — un calice ordinato oggi significa che il resto potrebbe andare sprecato domani. I menu cartacei non possono stare al passo con la disponibilità giornaliera."
    solution_label: "La soluzione"
    solution_title: "Un menu live che muove il tuo inventario"
    solution_description: "aperto.wine offre ai tuoi clienti una carta dei vini digitale in tempo reale. Vedono cosa è disponibile in questo momento, ordinano al calice, e tu apri solo ciò che si vende. Nessun azzardo. Nessuno spreco. Solo vino, condiviso."
    how_label: "Come funziona"
    how_title: "Tre passi al primo calice"
    steps:
      - title: "Cura la tua lista"
        description: "Aggiungi i vini che vuoi offrire al calice. Imposta prezzi, dimensioni del calice e disponibilità. Aggiorna quando vuoi."
      - title: "Posiziona il QR code"
        description: "Stampa il QR code generato per i tuoi tavoli. I clienti scannerizzano e vedono istantaneamente la tua selezione live."
      - title: "Versa e guadagna"
        description: "I clienti ordinano dal telefono. Tu approvi, versi, e trasformi l'inventario fermo in ricavo."
    restaurants_label: "Per i ristoranti"
    restaurants_title: "Trasforma lo stock fermo in profitto versato"
    restaurants_description: "Le tue bottiglie pregiate non dovrebbero restare chiuse. aperto.wine ti permette di offrire qualsiasi vino al calice senza overhead — nessun menu da ristampare, nessun passaparola. Solo una lista live di cui i tuoi clienti si fidano."
    restaurants_cta: "Registra il tuo ristorante"
    restaurant_features:
      - icon: "list-bullets"
        title: "Menu live"
        description: "Aggiorna la disponibilità in tempo reale. Niente carta, nessun ritardo."
      - icon: "qr-code"
        title: "Accesso QR"
        description: "Una scansione e i clienti vedono ogni vino disponibile."
      - icon: "currency-eur"
        title: "Prezzi flessibili"
        description: "Imposta prezzi al calice per 75ml, 100ml, 125ml o 150ml."
      - icon: "check-circle"
        title: "Approvazione ordini"
        description: "Rivedi e conferma ogni ordine prima di versare."
    customers_label: "Per gli amanti del vino"
    customers_title: "Assaggia le bottiglie che hai sempre desiderato"
    customers_description: "Non devi più scegliere tra una bottiglia costosa o accontentarti del vino della casa. Esplora cosa è disponibile al tuo tavolo, ordina un singolo calice di qualcosa di straordinario."
    customers_cta: "Esplora come cliente"
    customer_features:
      - icon: "magnifying-glass"
        title: "Scopri"
        description: "Cerca per colore, vitigno, anno o fascia di prezzo."
      - icon: "wine"
        title: "Ordina al calice"
        description: "Scegli la misura e aggiungi al carrello con un tap."
      - icon: "clock"
        title: "Appena aperta"
        description: "Vedi quando ogni bottiglia è stata aperta per la massima freschezza."
      - icon: "map-pin"
        title: "Al tuo tavolo"
        description: "Scansiona il QR, ordina, e il tuo vino arriva in pochi istanti."
    cta_title: "Pronti a versare?"
    cta_subtitle: "Unisciti ai ristoranti che stanno già trasformando le loro bottiglie migliori in esperienze condivise."
    footer_rights: "Tutti i diritti riservati."
    cta_restaurant: "Sono un ristorante"
    cta_customer: "Sono un amante del vino"
