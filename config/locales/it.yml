  landing:
    title: "aperto.wine — Al Calice, Per Scelta"
    meta_description: "Una carta dei vini digitale e aggiornata in tempo reale che permette ai ristoranti di vendere bottiglie pregiate al calice. I clienti scoprono e ordinano vini eccellenti senza impegnarsi per un'intera bottiglia."
    account_nav: "Account"
    sign_in: "Accedi"
    sign_up: "Inizia ora"
    hero_tagline: "La carta dei vini live"
    # Entrambe le righe in tondo — la seconda è colorata dalla vista con lo
    # scalino centrale della rampa oxblood, mai in corsivo.
    hero_title_html: "Ogni grande bottiglia<br><span>merita di essere aperta</span>"
    hero_subtitle: "Una carta dei vini digitale che permette al tuo ristorante di vendere bottiglie pregiate al calice. I clienti ordinano. Tu versi. Nessuno spreco."
    how_label: "Come funziona"
    how_title: "Tre passi al primo calice"
    steps:
      - title: "Cura la tua lista"
        description: "Aggiungi i vini che vuoi offrire al calice. Imposta prezzi, dimensioni del calice e disponibilità. Aggiorna quando vuoi."
      - title: "Posiziona il QR code"
        description: "Stampa il QR code generato per i tuoi tavoli. I clienti scannerizzano e vedono istantaneamente la tua selezione live."
      - title: "Versa e guadagna"
        description: "I clienti ordinano dal telefono. Tu approvi, versi, e trasformi l'inventario fermo in ricavo."
    restaurants_label: "Per i ristoranti"
    restaurants_title: "Trasforma lo stock fermo in profitto versato"
    restaurants_description: "Le tue bottiglie pregiate non dovrebbero restare chiuse. aperto.wine ti permette di offrire qualsiasi vino al calice senza overhead — nessun menu da ristampare, nessun passaparola. Solo una lista live di cui i tuoi clienti si fidano."
    restaurants_cta: "Registra il tuo ristorante"
    customers_label: "Per gli amanti del vino"
    customers_title: "Assaggia le bottiglie che hai sempre desiderato"
    customers_description: "Non devi più scegliere tra una bottiglia costosa o accontentarti del vino della casa. Esplora cosa è disponibile al tuo tavolo, ordina un singolo calice di qualcosa di straordinario."
    customers_cta: "Esplora come cliente"
    cta_title: "Pronti a versare?"
