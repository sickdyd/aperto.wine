        total_amount_cents: "Totale"
        guest_name: "Nome cliente"
        restaurant: "Ristorante"
        customer: "Cliente"
        restaurant_table: "Tavolo"
      order_item:
        glass_size_ml: "Formato calice"
        quantity: "Quantità"
        unit_price_cents: "Prezzo unitario"
        order: "Ordine"
        wine: "Vino"
    errors:
      # Rails composes "%{attribute} %{message}" and rails-i18n's Italian halves
      # are masculine singular ("è troppo lungo"). These attributes are
      # feminine, so their too_long message is overridden to agree ("lunga").
      # See test/models/italian_validation_messages_test.rb for the guard.
      models:
        wine:
          attributes:
            image_url:
              invalid_url: "deve essere un URL http(s)"
            short_description:
              too_long:
                one: "è troppo lunga (il massimo è %{count} carattere)"
                other: "è troppo lunga (il massimo è %{count} caratteri)"
        wine_list:
          attributes:
            season:
              too_long:
                one: "è troppo lunga (il massimo è %{count} carattere)"
                other: "è troppo lunga (il massimo è %{count} caratteri)"
        restaurant_table:
          attributes:
            area:
              too_long:
                one: "è troppo lunga (il massimo è %{count} carattere)"
                other: "è troppo lunga (il massimo è %{count} caratteri)"
        wine_list_item:
          attributes:
            wine:
              wrong_restaurant: "deve appartenere allo stesso ristorante della lista"
        # "Verifica" is feminine, so the participle agrees ("attivata").
        restaurant:
          attributes:
            geofence_enabled:
              requires_coordinates: "non può essere attivata senza le coordinate del ristorante"
        # Password and Email are feminine (rails-i18n itself ships
        # password_too_long: "è troppo lunga"; Email < posta elettronica), so
        # their blank/too_short/invalid halves agree in gender.
        user:
          attributes:
            password:
              too_short:
                one: "è troppo corta (il minimo è %{count} carattere)"
                other: "è troppo corta (il minimo è %{count} caratteri)"
              blank: "non può essere lasciata in bianco"
            email:
              blank: "non può essere lasciata in bianco"
              invalid: "non è valida"
