  # Model layer. Composed by Rails into "%{model}"/"%{attribute} %{message}"
  # sentences (see rails-i18n it.yml for the message halves, e.g. "deve
  # esistere", "non può essere lasciato in bianco"), so the model names carry
  # the gender the surrounding sentence assumes. Only attributes that surface
  # in a validation or a form are translated. `wine_list` reads "Lista" to match
  # the owner UI, which already says "Nuova Lista" / "Aggiungi Lista"; "Carta
  # dei vini" stays reserved for the public menu.
