default: &default
  adapter: postgresql
  encoding: unicode
  # Disable GSSAPI negotiation: libpq's Kerberos calls are not fork-safe on
  # macOS and segfault under parallel (forking) tests. Harmless on Linux/CI.
  gssencmode: disable
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  # Pool must cover Puma threads + SolidQueue threads (workers + dispatcher)
  # when SOLID_QUEUE_IN_PUMA is set, so DB_POOL (Render) takes precedence.
  max_connections: <%= ENV.fetch("DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 5)) %>

development:
  <<: *default
  database: aperto_wine_development

test:
  <<: *default
  database: aperto_wine_test

# Single database (jeero pattern): Render provisions one Postgres per
# environment, so Solid Cache and Solid Queue tables live in the primary
# schema (created via regular migrations) instead of separate databases.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
