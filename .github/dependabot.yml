version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Bundle all non-breaking gem bumps into a single weekly PR.
      # Major bumps are excluded so they get their own reviewable PR.
      ruby-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Bundle non-breaking JS bumps into one PR.
      # Major bumps are excluded so they get their own reviewable PR.
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # All GitHub Actions bumps in one PR.
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
