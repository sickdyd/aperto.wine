name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # The Dockerfile is the Kamal deploy path, and Render auto-detects it for any
  # service created from the dashboard instead of the Blueprint. Nothing else in
  # CI executes it, so a broken image build only ever surfaced as a failed
  # deploy. Building it here keeps that feedback in the PR.
  build_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in importmap-pinned JavaScript
        run: bin/importmap audit

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Scan for security vulnerabilities in npm dependencies
        run: npm audit --audit-level=moderate

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # The Expo client has its own toolchain and its own test suite; neither is
  # reachable from the Rails jobs above. Without this job nothing in mobile/ is
  # ever executed in CI and the suite quietly rots.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Last, not first: this step is the one most likely to go red for reasons
      # that have nothing to do with the PR — a fresh advisory upstream — and a
      # step that fails stops the job. Running it after the build signals means
      # a PR that trips it still reports whether it typechecks and passes.
      #
      # `npm audit` on its own cannot be used: it fails today on three
      # advisories in Expo's own build toolchain that have no non-regressing
      # fix, and npm offers no way to acknowledge one (npm/cli#8886).
      # mobile/scripts/audit.js keeps the check on and moves only those three
      # aside — see mobile/audit-allowlist.jsonc for the justification for each.
      #
      # It is hand-rolled because the off-the-shelf option, audit-ci, fails
      # *open*: given a report in a schema it does not know, or an npm that
      # errored out, it prints "Passed npm security audit" and exits 0. This
      # step going green has to mean something.
      - name: Scan for security vulnerabilities in the Expo client's dependencies
        run: npm run audit

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Icon SVGs are gitignored and synced via rails_icons (see .gitignore).
      # Cache them keyed on the gem version so the ~35MB download happens once.
      - name: Cache synced icons
        id: rails_icons
        uses: actions/cache@v6
        with:
          path: app/assets/svg/icons
          key: rails-icons-${{ hashFiles('Gemfile.lock') }}

      - name: Sync icon SVGs
        if: steps.rails_icons.outputs.cache-hit != 'true'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails generate rails_icons:sync --library=phosphor --force --quiet

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Icon SVGs are gitignored and synced via rails_icons (see .gitignore).
      # Cache them keyed on the gem version so the ~35MB download happens once.
      - name: Cache synced icons
        id: rails_icons
        uses: actions/cache@v6
        with:
          path: app/assets/svg/icons
          key: rails-icons-${{ hashFiles('Gemfile.lock') }}

      - name: Sync icon SVGs
        if: steps.rails_icons.outputs.cache-hit != 'true'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails generate rails_icons:sync --library=phosphor --force --quiet

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        # Build Tailwind up front so the first browser request isn't racing a
        # lazy asset build (a source of first-load system-test flakiness).
        run: bin/rails db:test:prepare tailwindcss:build test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
